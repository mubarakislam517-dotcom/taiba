<style>
  :root{
    --bg:#0b0820; --bg2:#141033; --panel:#181243; --panel2:#1f1855;
    --line:#2c2466; --text:#ece9ff; --muted:#a9a3d8;
    --accent:#7c5cff; --accent2:#b06bff; --teal:#3ee0cd; --warn:#ffcc66; --danger:#ff6b81;
    --radius:18px; --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(900px 520px at 85% -8%, #2a1a66 0%, transparent 60%),
      radial-gradient(700px 460px at 0% 105%, #122a55 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hind Siliguri","Noto Sans Bengali","Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.6; overscroll-behavior-y:none;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{background:none;border:0;cursor:pointer}
  a{color:var(--teal)}

  .app{display:flex;flex-direction:column;height:100dvh;max-width:860px;margin:0 auto;position:relative}

  header.top{
    display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;
    background:rgba(11,8,32,.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line); position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
  .brand img{width:38px;height:38px;border-radius:11px;box-shadow:0 4px 14px rgba(124,92,255,.45)}
  .brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
  .brand .sub{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:-1px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);flex:none;box-shadow:0 0 8px var(--teal)}
  .dot.demo{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  .dot.off{background:var(--danger);box-shadow:0 0 8px var(--danger)}
  .iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:rgba(255,255,255,.03);flex:none}
  .iconbtn:active{transform:scale(.94)}
  .iconbtn svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  .banner{display:none;align-items:center;gap:8px;padding:9px 12px;font-size:13px;background:linear-gradient(90deg,#3a2a00,#2a1f4d);border-bottom:1px solid var(--line)}
  .banner.show{display:flex}
  .banner.err{background:linear-gradient(90deg,#3a0d17,#2a1f4d)}
  .banner button{margin-inline-start:auto;border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:5px 10px;font-size:12.5px;white-space:nowrap}

  /* ---------- চ্যাট ---------- */
  #chat{flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
  .row{display:flex;gap:8px;align-items:flex-end;max-width:100%;animation:pop .22s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .row.user{flex-direction:row-reverse}
  .ava{width:30px;height:30px;border-radius:9px;flex:none;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.35)}
  .ava img{width:100%;height:100%;display:block}
  .bubble{
    max-width:min(78ch,84%);padding:10px 13px;border-radius:var(--radius);position:relative;
    background:var(--panel);border:1px solid var(--line);word-wrap:break-word;overflow-wrap:anywhere;
  }
  .row.user .bubble{background:linear-gradient(135deg,#5b3cf0,#8a4cf0);border-color:#7a5cf5;border-bottom-right-radius:6px}
  .row.bot .bubble{border-bottom-left-radius:6px}
  .bubble .imgs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .bubble .imgs img{width:112px;height:112px;object-fit:cover;border-radius:12px;border:1px solid rgba(255,255,255,.15)}
  .bubble .speak{margin-top:6px;font-size:11.5px;color:var(--muted);display:inline-flex;gap:4px;align-items:center}
  .bubble.pending{border-style:dashed}
  .sys{align-self:center;font-size:12.5px;color:var(--muted);background:rgba(255,255,255,.04);border:1px dashed var(--line);padding:5px 11px;border-radius:999px;max-width:90%;text-align:center}
  .toolchip{align-self:flex-start;font-size:12.5px;color:#cfe; background:rgba(62,224,205,.10);border:1px solid rgba(62,224,205,.3);padding:5px 11px;border-radius:999px}

  /* markdown */
  .md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
  .md p{margin:.4em 0}
  .md h3{font-size:15.5px;margin:.7em 0 .3em}
  .md ul,.md ol{margin:.35em 0;padding-inline-start:1.25em}
  .md li{margin:.15em 0}
  .md code{background:rgba(0,0,0,.35);padding:.1em .38em;border-radius:6px;font-size:13.5px;font-family:"SF Mono",ui-monospace,Menlo,monospace}
  .md pre{background:#0d0a26;border:1px solid var(--line);border-radius:12px;padding:10px 12px;overflow-x:auto;margin:.5em 0;position:relative}
  .md pre code{background:none;padding:0;font-size:13px;display:block;white-space:pre}
  .md blockquote{margin:.5em 0;padding:.1em .8em;border-inline-start:3px solid var(--accent);color:var(--muted)}
  .md hr{border:0;border-top:1px solid var(--line);margin:.8em 0}
  .copybtn{position:absolute;top:6px;inset-inline-end:6px;font-size:11px;border:1px solid var(--line);background:#181243;padding:3px 8px;border-radius:8px;color:var(--muted)}

  /* Typing */
  .typing{display:flex;gap:4px;align-items:center;padding:4px 2px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1.1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes bl{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  /* ---------- শুরু স্ক্রিন ---------- */
  .hello{align-self:center;text-align:center;margin:auto 0;padding:18px 6px;max-width:520px}
  .hello img{width:96px;height:96px;border-radius:26px;box-shadow:0 12px 40px rgba(124,92,255,.5)}
  .hello h2{margin:14px 0 4px;font-size:20px}
  .hello p{color:var(--muted);font-size:14px;margin:0 0 16px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chip{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:8px 13px;font-size:13.5px;color:var(--text)}
  .chip:active{background:rgba(124,92,255,.25)}

  /* ---------- কম্পোজার ---------- */
  .composer{padding:8px 10px calc(10px + var(--safe-b));background:rgba(11,8,32,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);position:sticky;bottom:0;z-index:20}
  .attachrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:7px}
  .attachrow .thumb{position:relative;width:58px;height:58px}
  .attachrow .thumb img{width:100%;height:100%;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
  .attachrow .thumb button{position:absolute;top:-6px;inset-inline-end:-6px;width:22px;height:22px;border-radius:50%;background:var(--danger);color:#fff;font-size:13px;line-height:1;display:grid;place-items:center}
  .inp{display:flex;align-items:flex-end;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:6px 6px 6px 8px}
  .inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.18)}
  .inp textarea{flex:1;background:none;border:0;outline:0;resize:none;max-height:132px;min-height:30px;padding:7px 4px;font-size:16px;line-height:1.45}
  .inp textarea::placeholder{color:#7e78ae}
  .round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.05);border:1px solid var(--line)}
  .round svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .round.mic.rec{background:rgba(255,107,129,.18);border-color:var(--danger)}
  .round.mic.rec svg{stroke:var(--danger)}
  .round.send{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;box-shadow:0 6px 18px rgba(124,92,255,.45)}
  .round.send svg{stroke:#fff}
  .round.send.busy{background:linear-gradient(135deg,#ff6b81,#e33d63);box-shadow:0 6px 18px rgba(255,107,129,.35)}
  .round:disabled{opacity:.45}
  .hint{font-size:11px;color:#7e78ae;margin:6px 4px 0;text-align:center}

  /* ---------- শিট / প্যানেল ---------- */
  .backdrop{position:fixed;inset:0;background:rgba(4,2,16,.6);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
  .backdrop.show{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;z-index:50;background:linear-gradient(180deg,var(--panel2),var(--bg2));
    border:1px solid var(--line);box-shadow:0 -20px 60px rgba(0,0,0,.6);
    inset:auto 0 0 0;max-height:88dvh;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.9,.25,1);
    border-radius:22px 22px 0 0;display:flex;flex-direction:column;
  }
  .sheet.open{transform:none}
  .grab{width:44px;height:4px;border-radius:99px;background:#4a4290;margin:8px auto 4px}
  .tabs{display:flex;gap:4px;padding:4px 10px 8px;overflow-x:auto}
  .tabs button{padding:8px 12px;border-radius:12px;font-size:13.5px;color:var(--muted);white-space:nowrap}
  .tabs button.on{background:rgba(124,92,255,.22);color:var(--text);font-weight:600}
  .sheetbody{overflow-y:auto;padding:4px 14px calc(20px + var(--safe-b))}
  .card{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
  .card h4{margin:0 0 8px;font-size:14px;color:var(--text)}
  label.f{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
  input[type=text],input[type=password],input[type=datetime-local],select,textarea.f{width:100%;background:#100c2e;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;outline:0}
  input:focus,select:focus,textarea.f:focus{border-color:var(--accent)}
  .row2{display:flex;gap:8px;align-items:center}
  .btn{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:12px;padding:9px 14px;font-size:14px}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;font-weight:600}
  .btn.danger{border-color:rgba(255,107,129,.5);color:var(--danger)}
  .btn:active{transform:scale(.97)}
  .muted{color:var(--muted);font-size:12.5px}
  .item{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);margin-bottom:8px}
  .item .grow{flex:1;min-width:0}
  .item b{display:block;font-size:14px;font-weight:600}
  .item small{color:var(--muted);font-size:12px}
  .xbtn{color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;border-radius:8px}
  .xbtn:hover{background:rgba(255,255,255,.08)}
  .sw{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 2px}
  .toggle{width:48px;height:28px;border-radius:99px;background:#2a2360;position:relative;border:1px solid var(--line);flex:none}
  .toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#cfcaf5;transition:.2s}
  .toggle.on{background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .toggle.on::after{transform:translateX(20px);background:#fff}
  .hidden{display:none !important}

  /* টোস্ট */
  #toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,20px);background:#241a55;border:1px solid var(--accent);padding:10px 16px;border-radius:14px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:88vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @media (min-width:900px){
    .sheet{inset:0 0 0 auto;width:420px;max-height:100dvh;height:100dvh;border-radius:22px 0 0 22px;transform:translateX(103%)}
    .sheet.open{transform:none}
    .grab{display:none}
    .tabs{padding-top:14px}
  }
</style>
</head>

const _mem = {};
const store = {
  get(k, d) {
    try { const v = localStorage.getItem(k); return v == null ? (_mem[k] ?? d) : JSON.parse(v); }
    catch (e) { return _mem[k] ?? d; }
  },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { _mem[k] = v; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} delete _mem[k]; },
};

function toast(msg, ms = 2800) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), ms);
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function bnTime(ms) {
  try {
    return new Intl.DateTimeFormat('bn-BD', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Dhaka' }).format(new Date(ms));
  } catch { return new Date(ms).toLocaleString(); }
}
function bnTimeShort(ms) {
  try { return new Intl.DateTimeFormat('bn-BD', { hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Dhaka' }).format(new Date(ms)); }
  catch { return new Date(ms).toLocaleTimeString(); }
}

/* ---------- মার্কডাউন → HTML ---------- */
function mdToHtml(src) {
  const blocks = [];
  let text = String(src == null ? '' : src).replace(/\r/g, '');

  // ১) কোড ব্লক আগে সরিয়ে রাখি (ভেতরের মার্কডাউন নষ্ট না হয়)
  text = text.replace(/```([\s\S]*?)```/g, (m, code) => {
    blocks.push(String(code).replace(/^[a-zA-Z0-9+#-]*\r?\n/, '').replace(/\r?\n$/, ''));
    return '\u0000CODE' + (blocks.length - 1) + '\u0000';
  });

  text = esc(text);
  text = text.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  text = text.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  text = text.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  text = text.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  text = text.replace(/^#{2,4}\s+(.+)$/gm, '<h3>$1</h3>');
  text = text.replace(/^&gt;\s?(.+)$/gm, '<blockquote>$1</blockquote>');
  text = text.replace(/^\s*[-*•]\s+(.+)$/gm, '<li>$1</li>');
  text = text.replace(/^\s*\d+[.)]\s+(.+)$/gm, '<li>$1</li>');
  text = text.replace(/^\s*-{3,}\s*$/gm, '<hr>');

  // ২) পরপর <li> গুলোকে একসাথে <ul> এ ঢুকাই
  text = text.replace(/(?:^|\n)((?:<li>[\s\S]*?<\/li>\n?)+)/g, (m, run) =>
    '\n<ul>' + run.replace(/\n+$/, '').replace(/\n/g, '') + '</ul>');

  // ৩) লাইন ধরে প্যারাগ্রাফ বানাই (ব্লক ট্যাগগুলো আলাদা থাকে)
  const lines = text.split('\n');
  let html = '', buf = [];
  const flush = () => { if (buf.length) { html += '<p>' + buf.join('<br>') + '</p>'; buf = []; } };
  for (const ln of lines) {
    const t = ln.trim();
    if (!t) { flush(); continue; }
    if (/^<(h3|ul|ol|pre|blockquote|hr|li)/.test(t) || /^\u0000CODE\d+\u0000$/.test(t)) { flush(); html += t; }
    else buf.push(ln);
  }
  flush();

  // ৪) কোড ব্লক ফিরিয়ে আনি
  html = html.replace(/\u0000CODE(\d+)\u0000/g, (m, i) =>
    '<pre><button class="copybtn" data-copy="' + i + '">কপি</button><code>' + esc(blocks[+i]) + '</code></pre>');

  return html || '<p></p>';
}
function stripMd(s) {
  return String(s || '')
    .replace(/```([\s\S]*?)```/g, ' ')
    .replace(/`([^`]+)`/g, '$1').replace(/\*\*([^*]+)\*\*/g, '$1').replace(/[*_#>|]/g, '')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').slice(0, 2500);
}

function renderChat(typing = false) {
  const chat = $('#chat');
  chat.innerHTML = '';
  if (!history.length) {
    const hi = cfg.userName ? `${esc(cfg.userName)}, আসসালামু আলাইকুম!` : 'আসসালামু আলাইকুম!';
    const chips = ['আজকের কাজের একটা প্ল্যান করে দাও', 'এই ছবিতে কী আছে দেখো', 'কাল সকাল ৯টায় আমাকে মনে করিয়ে দিও', 'আমার জন্য একটা ছোট নোট লেখো', 'আজকের আবহাওয়া কেমন থাকতে পারে?'];
    chat.innerHTML = `<div class="hello">
      <img src="${AVATAR}" alt="তাইবা">
      <h2>${hi} আমি তাইবা 🌙</h2>
      <p>আপনার ব্যক্তিগত সহকারী — বাংলায় লিখুন বা বলুন, ছবি পাঠান, রিমাইন্ডার আর নোট রাখুন।</p>
      <div class="chips">${chips.map((c) => `<button class="chip">${esc(c)}</button>`).join('')}</div>
    </div>`;
    $$('.chip', chat).forEach((b) => b.addEventListener('click', () => { $('#input').value = b.textContent; resizeInput(); $('#input').focus(); }));
  } else {
    history.forEach((m, idx) => {
      if (m.role === 'sys') { const d = document.createElement('div'); d.className = 'sys'; d.innerHTML = mdToHtml(m.text); chat.appendChild(d); return; }
      if (m.role === 'tool') { const d = document.createElement('div'); d.className = 'toolchip'; d.textContent = m.text; chat.appendChild(d); return; }
      const user = m.role === 'user';
      const row = document.createElement('div');
      row.className = 'row ' + (user ? 'user' : 'bot');
      const imgs = (m.images || []).length
        ? `<div class="imgs">${m.images.map((s) => `<img src="${s}" alt="">`).join('')}</div>` : '';
      const speakBtn = (!user && m.text) ? `<button class="speak" data-say="${idx}">🔊 পড়ে শোনাও</button>` : '';
      row.innerHTML = (user ? '' : `<div class="ava"><img src="${AVATAR}" alt=""></div>`) +
        `<div class="bubble md">${imgs}${user ? esc(m.text).replace(/\n/g, '<br>') : mdToHtml(m.text)}${speakBtn}</div>`;
      chat.appendChild(row);
    });
    if (typing) {
      const row = document.createElement('div');
      row.className = 'row bot';
      row.innerHTML = `<div class="ava"><img src="${AVATAR}" alt=""></div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>`;
      chat.appendChild(row);
    }
  }
  chat.scrollTop = chat.scrollHeight;
  $$('.copybtn', chat).forEach((b) => b.addEventListener('click', () => {
    const code = b.parentElement.querySelector('code').textContent;
    navigator.clipboard?.writeText(code).then(() => toast('কোড কপি হয়েছে ✅')).catch(() => toast('কপি করা গেল না'));
  }));
  $$('.speak', chat).forEach((b) => b.addEventListener('click', () => speak(stripMd(history[+b.dataset.say].text))));
}

/* ---------- স্ট্যাটাস ---------- */
function setStatus(kind, text) {
  const dot = $('#statusDot'); dot.className = 'dot' + (kind === 'demo' ? ' demo' : kind === 'off' ? ' off' : '');
  $('#statusText').textContent = text;
}
function statusLabel() {
  if (directMode) return 'ডাইরেক্ট মোড • ' + cfg.model.replace('gemini-', 'Gemini ');
  if (serverDemo && !cfg.apiKey) return 'ডেমো মোড';
  return cfg.model.replace('gemini-', 'Gemini ');
}
function refreshBanner() {
  const b = $('#banner');

}

/* ---------- সার্ভার কল ---------- */
function fileToPart(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1200;
        let { width: w, height: h } = img;
        const k = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * k); h = Math.round(h * k);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        let url;
        try { url = c.toDataURL('image/jpeg', 0.82); } catch { url = fr.result; }
        resolve({ mime: 'image/jpeg', b64: url.split(',')[1], dataUrl: url });
      };
      img.onerror = () => reject(new Error('ছবিটা পড়া গেল না'));
      img.src = fr.result;
    };
    fr.onerror = () => reject(new Error('ফাইল পড়া গেল না'));
    fr.readAsDataURL(file);
  });
}

async function callApi(systemText) {
  aborter = new AbortController();
  let res;
  try {
    res = await fetch('api/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-gemini-key': cfg.apiKey || '',
        'x-app-password': cfg.password || '',
      },
      body: JSON.stringify({
        contents, system: systemText, model: cfg.model,
        temperature: cfg.temperature, thinkingLevel: cfg.thinkingLevel, password: cfg.password,
      }),
      signal: aborter.signal,
    });
  } catch (err) {
    if (err && err.name === 'AbortError') throw err;
    const e2 = new Error('সার্ভারে পৌঁছানো যাচ্ছে না।'); e2.network = true; throw e2;
  }
  let data = {};
  try { data = await res.json(); } catch { data = { ok: false, error: 'সার্ভার থেকে ভুল উত্তর এসেছে (' + res.status + ')' }; }
  if (!res.ok || !data.ok) {
    const e = new Error(data.error || 'সমস্যা হয়েছে (' + res.status + ')');
    e.http = res.status; e.code = data.code;
    throw e;
  }
  return data;
}

/* ---------- ডাইরেক্ট মোড: সার্ভার ছাড়া সরাসরি Google-কে কল (স্ট্যাটিক হোস্টিংয়ের জন্য) ---------- */
function friendlyDirect(status, msg) {
  const s = String(msg || '');
  if (status === 400 && /API key not valid/i.test(s)) return 'API key ঠিক নেই। AI Studio থেকে নতুন key নিন।';
  if (status === 403) return 'এই key দিয়ে অনুমতি নেই (403)। AI Studio-তে প্রজেক্ট চেক করুন।';
  if (status === 404) return 'এই মডেল পাওয়া গেল না (404)। সেটিংস থেকে অন্য মডেল বাছুন।';
  if (status === 429) return 'ফ্রি লিমিট শেষ (429)। একটু পরে চেষ্টা করুন বা হালকা মডেল বাছুন।';
  if (status === 503 || status === 500) return 'Google-এর সার্ভারে সাময়িক চাপ (' + status + ')। আবার চেষ্টা করুন।';
  return 'সমস্যা (' + status + '): ' + s.slice(0, 180);
}
async function callDirect(systemText) {
  if (!cfg.apiKey) throw new Error('এই মোডে চলতে সেটিংসে Gemini API key দরকার।');
  const ctrl = new AbortController();
  aborter = ctrl;
  const gc = { temperature: cfg.temperature, maxOutputTokens: 8192 };
  if (/^gemini-3/.test(cfg.model)) gc.thinkingConfig = { thinkingLevel: cfg.thinkingLevel };
  const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(cfg.model) + ':generateContent', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': cfg.apiKey },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: systemText }] },
      contents,
      tools: [{ functionDeclarations: TOOLS_JS }],
      generationConfig: gc,
    }),
    signal: ctrl.signal,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(friendlyDirect(res.status, data?.error?.message));
  const cand = data?.candidates?.[0];
  const parts = cand?.content?.parts || [];
  return {
    ok: true, model: cfg.model, parts,
    text: parts.filter((p) => typeof p.text === 'string').map((p) => p.text).join('').trim(),
    calls: parts.filter((p) => p.functionCall).map((p) => ({ name: p.functionCall.name, args: p.functionCall.args || {} })),
    finishReason: cand?.finishReason || null,
  };
}
/* সার্ভার + ডাইরেক্ট — যেটা সম্ভব সেটাই ব্যবহার করি */
const ONEFILE = true;   // এক-ফাইল ভার্সন — কোনো সার্ভার নেই, সোজা Google-কে কল করি
async function callModel(systemText) {
  if (ONEFILE) {
    if (!cfg.apiKey) throw new Error('সেটিংসে Gemini API key বসান (☰ → সেটিংস)।');
    directMode = true;
    return callDirect(systemText);
  }
  if (directMode && cfg.apiKey) return callDirect(systemText);
  try {
    const d = await callApi(systemText);
    if (d.demo && cfg.apiKey) { directMode = true; return callDirect(systemText); }
    if (d.demo) { serverDemo = true; }
    return d;
  } catch (e) {
    if (e.network || e.http === 404 || e.http === 405 || e.http === 501) {
      if (!cfg.apiKey) throw new Error('সার্ভারে পৌঁছানো যাচ্ছে না — ইন্টারনেট চেক করুন, বা সেটিংসে API key দিলে সরাসরিও চলবে।', { cause: e });
      directMode = true;
      return callDirect(systemText);
    }
    throw e;
  }
}

/* ---------- সিস্টেম প্রম্পট (তাইবার ব্যক্তিত্ব) ---------- */
function buildSystem() {
  const now = new Date();
  let local = now.toString(), iso = '';
  try {
    local = new Intl.DateTimeFormat('bn-BD', { dateStyle: 'full', timeStyle: 'short', timeZone: 'Asia/Dhaka' }).format(now);
    iso = new Intl.DateTimeFormat('en-CA', { dateStyle: 'short', timeZone: 'Asia/Dhaka' }).format(now);
  } catch {}
  const tz = '+06:00';
  const owner = cfg.userName ? `ব্যবহারকারীর নাম: ${cfg.userName}। তাকে "${cfg.userName}" নামে ডাকবে।` : 'ব্যবহারকারীর নাম জানা নেই — ভদ্রভাবে "আপনি" বলে সম্বোধন করবে।';
  const mem = memories.length ? `\nব্যবহারকারী সম্পর্কে যা মনে আছে:\n${memories.map((m) => '- ' + m.fact).join('\n')}` : '';
  const nt = notes.length ? `\nসেভ করা নোট (সারসংক্ষেপ):\n${notes.slice(-10).map((n) => '- ' + n.title).join('\n')}` : '';
  const rmLines = reminders.filter((r) => !r.done).slice(0, 10).map((r) => `- ${bnTime(r.when)} — ${r.text}`).join('\n');

  return `তুমি "তাইবা" — একজন উষ্ণ, ভদ্র, হাসিখুশি ব্যক্তিগত AI সহকারী। ব্যবহারকারী বাংলাদেশে থাকেন।

ভাষা ও স্টাইল:
- সহজ, প্রাকৃতিক বাংলায় উত্তর দেবে (বাংলা ভাষায় লিখলে)। ইংরেজিতে লিখলে ইংরেজিতে।
- উত্তর হবে সংক্ষিপ্ত ও কাজের মতো। দরকার হলে বুলেট, ছোট হেডিং, বা ধাপে ধাপে লিখবে।
- কোড চাইলে কোড ব্লকে দেবে।
- ধরুন-ধরুন কথা বলবে না; না জানলে সৎভাবে বলবে।
- কখনো বলবে না যে তুমি Google বা Gemini — তুমি "তাইবা"।
${owner}

সময় ও তারতম্য:
- বর্তমান সময় (ঢাকা): ${local} (${iso}, UTC${tz} — অফসেট ${tz})
- সময়/তারিখ/রিমাইন্ডার নিয়ে কাজের আগে প্রয়োজনে get_now টুল কল করবে, নিজে অনুমান করবে না।

টুল ব্যবহারের নিয়ম:
- রিমাইন্ডার চাইলে set_reminder কল করবে; সময় সবসময় ঢাকার টাইমজোন (+06:00) সহ ISO ফরম্যাটে দেবে।
- নোট রাখতে বললে add_note, পুরনো নোট দেখতে list_notes।
- ব্যবহারকারীর নিজের সম্পর্কে স্থায়ী তথ্য (নাম, পছন্দ, রুটিন, কাজ) জানলে remember কল করে রাখবে — প্রতিবার আলাদা করে জিজ্ঞেস করবে না।

${cfg.persona ? `\nব্যবহারকারীর বাড়তি নির্দেশনা (সবচেয়ে গুরুত্বপূর্ণ):\n${cfg.persona}` : ''}`;

/* ---------- টুল চালানো (ডিভাইসেই) ---------- */
function tl(name, args) {
  switch (name) {
    case 'get_now': {
      const n = Date.now();
      return { result: `এখনকার সময়: ${bnTime(n)} (ঢাকা, UTC+06:00)। ISO: ${new Date(n).toISOString()}। বার: ${new Intl.DateTimeFormat('bn-BD', { weekday: 'long', timeZone: 'Asia/Dhaka' }).format(n)}` };
    }
    case 'set_reminder': {
      const t = Date.parse(args.when_iso || '');
      if (isNaN(t)) return { result: 'সময় বুঝতে পারিনি — when_iso আবার ISO 8601 ফরম্যাটে দিন (যেমন 2026-09-22T09:00:00+06:00)।' };
      const r = { id: uid(), text: args.text || 'রিমাইন্ডার', when: t, done: false, repeat: args.repeat || 'none', fired: false };
      reminders.push(r); persist();
      askNotify();
      return { result: `রিমাইন্ডার সেভ হয়েছে: "${r.text}" — ${bnTime(t)}${r.repeat !== 'none' ? ' (পুনরাবৃত্তি: ' + r.repeat + ')' : ''}` };
    }
    case 'list_reminders': {
      const list = reminders.filter((r) => !r.done).sort((a, b) => a.when - b.when);
      return { result: list.length ? list.map((r, i) => `${i + 1}. ${bnTime(r.when)} — ${r.text}`).join(' | ') : 'কোনো সক্রিয় রিমাইন্ডার নেই।' };
    }
    case 'add_note': {
      notes.push({ id: uid(), title: args.title || 'নোট', body: args.body || '', ts: Date.now() }); persist();
      return { result: `নোট সেভ হয়েছে: "${args.title}"` };
    }
    case 'list_notes': {
      return { result: notes.length ? notes.slice(-15).map((n, i) => `${i + 1}. ${n.title} — ${String(n.body).slice(0, 80)}`).join(' | ') : 'এখনো কোনো নোট নেই।' };
    }
    case 'remember': {
      const f = (args.fact || '').trim();
      if (!f) return { result: 'কিছু বুঝতে পারিনি।' };
      if (!memories.some((m) => m.fact === f)) memories.push({ id: uid(), fact: f, ts: Date.now() });
      persist();
      return { result: 'মনে রাখলাম: ' + f };
    }
    default:
      return { result: 'অজানা টুল: ' + name };
  }
}
function toolLabel(name, out) {
  const map = {
    get_now: '🕐 সময় দেখলাম',
    set_reminder: '⏰ রিমাইন্ডার সেট করলাম',
    list_reminders: '⏰ রিমাইন্ডার দেখলাম',
    add_note: '📝 নোট সেভ করলাম',
    list_notes: '📝 নোট দেখলাম',
    remember: '🧠 মনে রাখলাম',
  };
  return map[name] || ('🔧 ' + name);
}

/* ---------- পাঠানোর মূল ইঞ্জিন ---------- */
async function send(text, images) {
  if (busy) return;
  text = (text || '').trim();
  const imgs = images || pending;
  if (!text && !imgs.length) return;

  const parts = [];
  imgs.forEach((im) => parts.push({ inlineData: { mimeType: im.mime, data: im.b64 } }));
  if (text) parts.push({ text });
  contents.push({ role: 'user', parts });
  history.push({ role: 'user', text, images: imgs.map((i) => i.dataUrl), ts: Date.now() });
  pending = []; renderAttach(); $('#input').value = ''; resizeInput();
  persist(); renderChat(true);

  busy = true; setStatus('', 'ভাবছে…');
  $('#btnSend').classList.add('busy'); $('#btnMic').disabled = true;   // busy থাকলে একই বাটন = থামানোর বাটন
  $('#btnSend').innerHTML = '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>';
  const system = buildSystem();

  try {
    let rounds = 0;
    while (rounds < 6) {
      let data;
      try {
        data = await callModel(system);
      } catch (e) {
        // ফাংশন রেসপন্স role: কোনো কারণে 'user' না চললে 'function' দিয়ে আবার চেষ্টা
        if (e.http === 400 && /role|function/i.test(e.message) && fnRole === 'user') { fnRole = 'function'; continue; }
        if (e.code === 'need_password') { toast('পাসওয়ার্ড দরকার — সেটিংসে দিন'); openSheet('settings'); }
        pushSys('⚠️ ' + e.message);
        break;
      }

      if (data.demo) {
        serverDemo = true; refreshBanner(); setStatus('demo', 'ডেমো মোড');
        history.push({ role: 'bot', text: data.text, ts: Date.now() });
        break;
      }

      if (Array.isArray(data.parts) && data.parts.length) contents.push({ role: 'model', parts: data.parts });
      const calls = data.calls || [];

      if (calls.length) {
        const replyParts = [];
        for (const c of calls) {
          const out = tl(c.name, c.args || {});
          history.push({ role: 'tool', text: toolLabel(c.name, out), ts: Date.now() });
          replyParts.push({ functionResponse: { name: c.name, response: { result: out.result } } });
        }
        contents.push({ role: fnRole, parts: replyParts });
        persist(); renderChat(true); rounds++;
        continue;
      }

      let out = data.text || '';
      if (!out) out = '🤔 এই মুহূর্তে কিছু বলতে পারলাম না — আবার একবার জিজ্ঞেস করবেন?';
      if (data.finishReason === 'MAX_TOKENS') out += '\n\n_(উত্তরটা বড় হয়ে যাওয়ায় কেটে গেছে — “চালিয়ে যাও” লিখলে বাকিটা দেব।)_';
      history.push({ role: 'bot', text: out, ts: Date.now(), model: data.model });
      if (cfg.speak) speak(stripMd(out));
      if (data.model && data.model !== cfg.model) setStatus('', data.model.replace('gemini-', 'Gemini '));
      break;
    }
    if (rounds >= 6) pushSys('⚠️ অনেক ধাপ হয়ে গেল — কথাটা একটু ভেঙে বলবেন?');
  } catch (e) {
    pushSys(e.name === 'AbortError' ? '⏹️ থামিয়ে দিলাম।' : '⚠️ ' + (e.message || 'সমস্যা হয়েছে'));
  } finally {
    busy = false; aborter = null;
    $('#btnSend').classList.remove('busy'); $('#btnMic').disabled = false;
    $('#btnSend').innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 8 6 8z"/></svg>';
    setStatus(serverDemo && !cfg.apiKey && !directMode ? 'demo' : '', statusLabel());
    persist(); renderChat(false);
  }
}
function pushSys(t) { history.push({ role: 'sys', text: t, ts: Date.now() }); persist(); }

/* ---------- ভয়েস (বলা + শোনা) ---------- */
function speak(text) {
  if (!('speechSynthesis' in window)) { toast('এই ব্রাউজারে ভয়েস আউটপুট নেই'); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = cfg.voiceLang || 'bn-BD';
    const vs = speechSynthesis.getVoices();
    const v = vs.find((v) => v.lang === u.lang) || vs.find((v) => v.lang && v.lang.startsWith(u.lang.split('-')[0]));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch { toast('পড়ে শোনানো গেল না'); }
}
let recog = null;
function toggleMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('ভয়েস ইনপুট সাপোর্ট নেই। iPhone-এ কীবোর্ডের 🎤 বাটন ব্যবহার করতে পারেন।', 4200); return; }
  const btn = $('#btnMic');
  if (recog) { recog.stop(); return; }
  recog = new SR();
  recog.lang = cfg.voiceLang || 'bn-BD';
  recog.interimResults = true; recog.continuous = false;
  const start = $('#input').value;
  recog.onresult = (e) => {
    let txt = '';
    for (let i = e.resultIndex; i < e.results.length; i++) txt += e.results[i][0].transcript;
    $('#input').value = (start ? start + ' ' : '') + txt; resizeInput();
  };
  recog.onend = () => { recog = null; btn.classList.remove('rec'); setStatus('', statusLabel()); };
  recog.onerror = (e) => { toast('ভয়েস শোনা গেল না (' + (e.error || '?') + ')'); };
  try { recog.start(); btn.classList.add('rec'); setStatus('', 'শুনছি…'); } catch { recog = null; }
}

/* ---------- রিমাইন্ডার ইঞ্জিন ---------- */
function askNotify() {

  if (Notification.permission === 'denied') { toast('নোটিফিকেশন বন্ধ — তাইবা খোলা থাকলে ভেতরেই জানাবে।', 4500); return; }

}

/* ---------- ক্যালেন্ডার (.ics) ---------- */
function icsFor(r) {
  const dt = (ms) => new Date(ms).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const esc2 = (s) => String(s).replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n');
  const end = new Date(r.when + 30 * 60000);
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Taiba//BN', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
    'UID:' + r.id + '@taiba', 'DTSTAMP:' + dt(Date.now()), 'DTSTART:' + dt(r.when), 'DTEND:' + dt(end.getTime()),
    'SUMMARY:' + esc2('⏰ ' + r.text), 'DESCRIPTION:' + esc2('তাইবা রিমাইন্ডার'), 'BEGIN:VALARM',
    'TRIGGER:PT0M', 'ACTION:DISPLAY', 'DESCRIPTION:' + esc2(r.text), 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
}
function download(name, text, mime = 'text/plain') {
  const blob = new Blob([text], { type: mime + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ---------- প্যানেল UI ---------- */
let currentTab = 'settings';
function openSheet(tab) {
  currentTab = tab || currentTab;
  $$('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === currentTab));
  renderSheet();
  $('#sheet').classList.add('open'); $('#backdrop').classList.add('show');
  $('#sheet').setAttribute('aria-hidden', 'false');
}
function closeSheet() {
  $('#sheet').classList.remove('open'); $('#backdrop').classList.remove('show');
  $('#sheet').setAttribute('aria-hidden', 'true');
}
$('#backdrop').addEventListener('click', closeSheet);
$$('.tabs button').forEach((b) => b.addEventListener('click', () => { currentTab = b.dataset.tab; openSheet(currentTab); }));

/* ---------- ইনপুট হ্যান্ডলিং ---------- */
function resizeInput() {
  const t = $('#input'); t.style.height = 'auto';
  t.style.height = Math.min(132, t.scrollHeight) + 'px';
}
function renderAttach() {
  const r = $('#attachRow');
  r.innerHTML = pending.map((p, i) => `<div class="thumb"><img src="${p.dataUrl}" alt=""><button data-x="${i}">✕</button></div>`).join('');
  $$('[data-x]', r).forEach((x) => x.onclick = () => { pending.splice(+x.dataset.x, 1); renderAttach(); });
}
$('#input').addEventListener('input', resizeInput);
$('#input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && (e.metaKey || e.ctrlKey)) { e.preventDefault(); doSend(); }
});
$('#btnSend').addEventListener('click', doSend);
function doSend() {
  if (busy) { try { aborter?.abort(); } catch {} return; }
  send($('#input').value, pending);
}
$('#btnImg').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  for (const f of files) {
    try { const part = await fileToPart(f); pending.push(part); } catch (err) { toast(err.message); }
  }
  renderAttach(); e.target.value = '';
  if (files.length) toast('ছবি যোগ হয়েছে — সাথে প্রশ্ন লিখে পাঠান');
});
$('#btnMic').addEventListener('click', toggleMic);
$('#btnNew').addEventListener('click', () => {
  if (busy) return toast('একটু অপেক্ষা করুন…');
  if (history.length && !confirm('নতুন চ্যাট শুরু করব? পুরনো কথা মুছে যাবে (নোট/মেমরি থাকবে)।')) return;
  history = []; contents = []; persist(); renderChat(false); toast('নতুন চ্যাট 🌙');
});
$('#btnMenu').addEventListener('click', () => openSheet(currentTab));
$('#bannerBtn').addEventListener('click', () => openSheet('settings'));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

/* ---------- শুরু ---------- */
async function boot() {
  renderChat(false); renderAttach(); refreshBanner();
  directMode = true;
  cfg.forceDirect = true;
  setStatus(cfg.apiKey ? '' : 'demo', cfg.apiKey ? statusLabel() : 'ডেমো মোড');
  if (ONEFILE) {                     // সার্ভার ছাড়া চলছি — শুরুতেই জানিয়ে দিই
    if (!cfg.apiKey) pushSys('🔑 শুরু করতে: ☰ মেনু → সেটিংস → Gemini API key বসিয়ে “সেভ করুন” चাপুন।');
    else setStatus('', statusLabel());
    refreshBanner();
    checkDue();
    return;
  }
  try {
    const r = await fetch('api/config'); const d = await r.json();
    serverDemo = !!d.demo;
    if (d.passwordRequired && !cfg.password) pushSys('🔒 এই তাইবার জন্য পাসওয়ার্ড দরকার — সেটিংসে দিন।');
    refreshBanner();
    if (!d.demo) { setStatus('', 'অনলাইন • ' + (d.defaultModel || cfg.model).replace('gemini-', 'Gemini ')); }
    else if (cfg.apiKey) { setStatus('', statusLabel()); }
    else { setStatus('demo', 'ডেমো মোড'); }
  } catch {
    // সার্ভার নেই (স্ট্যাটিক হোস্টিং বা অফলাইন) — key থাকলে সরাসরি চলি
    if (cfg.apiKey) { directMode = true; refreshBanner(); setStatus('', statusLabel()); }
    else setStatus('off', 'সেটআপ দরকার');
  }
  checkDue();
  try { speechSynthesis?.getVoices(); } catch {}
  if ('Notification' in window && Notification.permission === 'default') {
    setTimeout(() => toast('টিপস: ⏰ রিমাইন্ডারের জন্য ☰ মেনু → রিমাইন্ডার → “নোটিফিকেশন চালু করুন”।', 4500), 4000);
  }
}
boot();

</script>
